services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bavi
      POSTGRES_PASSWORD: dev_only_change_me
      POSTGRES_DB: bavi
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  cache:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  dbdata:
